<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color drives the native mobile-browser top bar tint.
         Defaulted to the dark canvas value here so the bar matches
         the dark theme on first paint (which is the app's default).
         The bootstrap script below updates it to the light-canvas
         value when the user has persisted 'light' in localStorage,
         and ProfilePage's toggleTheme updates it again on each flip.
         Without this, the bar would render bright clinical-blue
         (#2A6FD9) against the dark canvas — visible mismatch on
         iOS Safari and Chrome on Android. -->
    <meta name="theme-color" content="#0B0F1A" />
    <title>ForMen · Digital Clinic — Men's Hormonal Health</title>
    <meta
      name="description"
      content="Your hair loss, your fatigue, and your sex drive might be the same problem. One hormonal system controls all three. Find out in 3 minutes — anonymous, no email needed."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ForMen · Digital Clinic — Men's Hormonal Health" />
    <meta
      property="og:description"
      content="Your hair loss, your fatigue, and your sex drive might be the same problem. One hormonal system controls all three."
    />
    <meta property="og:image" content="/hero-cover.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon — the actual brand wordmark PNG. SVG fallback exists at
         /favicon.svg for older agents that don't render PNG favicons
         crisply, but PNG matches the brand asset exactly. -->
    <link rel="icon" type="image/png" href="/formen-logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/formen-logo.png" />

    <!-- Preload the hero LCP image so first paint shows it instantly.
         WebP is preferred (~60 KB) — browsers without WebP support skip
         this preload (correct behavior) and load the PNG fallback from
         the <picture> element on render. -->
    <link rel="preload" as="image" href="/hero-cover.webp" type="image/webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap. Stamps `data-theme` onto <html> BEFORE the React
         bundle parses, so the first paint already carries the user's
         persisted theme (no light/dark flash on cold visits).

         EXTERNAL, not inline, on purpose: the production CSP in
         vercel.json is `script-src 'self'` with no 'unsafe-inline', which
         silently blocks inline scripts. As an inline script this never
         ran in prod — `data-theme` stayed unset and the deployed site
         fell back to the light base palette (dark looked broken on
         mobile). A same-origin file satisfies 'self' with no CSP hash to
         maintain. Synchronous + in <head> so it still runs before paint.
         Source: public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
