<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A6FD9" />
    <title>ForMen · Digital Clinic — Men's Hormonal Health</title>
    <meta
      name="description"
      content="Your hair loss, your fatigue, and your sex drive might be the same problem. One hormonal system controls all three. Find out in 3 minutes — anonymous, no email needed."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ForMen · Digital Clinic — Men's Hormonal Health" />
    <meta
      property="og:description"
      content="Your hair loss, your fatigue, and your sex drive might be the same problem. One hormonal system controls all three."
    />
    <meta property="og:image" content="/hero-cover.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon — the actual brand wordmark PNG. SVG fallback exists at
         /favicon.svg for older agents that don't render PNG favicons
         crisply, but PNG matches the brand asset exactly. -->
    <link rel="icon" type="image/png" href="/formen-logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/formen-logo.png" />

    <!-- Preload the hero LCP image so first paint shows it instantly.
         WebP is preferred (~60 KB) — browsers without WebP support skip
         this preload (correct behavior) and load the PNG fallback from
         the <picture> element on render. -->
    <link rel="preload" as="image" href="/hero-cover.webp" type="image/webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap.
         Stamps `data-theme` onto <html> BEFORE the React bundle parses,
         so the first paint already carries the user's persisted theme.
         Without this inline script the page would flash light→dark (or
         vice versa) on every cold visit while the JS bundle mounts and
         reads localStorage.

         Default is dark — the brand identity on first impression. The
         OS `prefers-color-scheme` is intentionally NOT honored on first
         visit; the only way to land on light is to have explicitly
         flipped the Profile toggle (which writes 'light' into
         localStorage). Inverting this rule (auto-honor OS pref) is a
         one-line edit if product wants it back. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dc_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* Private mode / quota / disabled storage. Fall back to the
             dark default so the brand stays consistent. */
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
