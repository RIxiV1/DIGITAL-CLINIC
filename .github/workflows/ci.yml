name: CI

# Runs the exact gate AGENTS.md and Vercel rely on
# (tsc --noEmit && vitest run && vite build, via `npm run build`) on every
# PR into main and every push to main — so "keep the build green" is
# enforced by machine, not honor system. A type error, a failing test, or
# a broken bundle now blocks the merge instead of slipping through.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer commit on the same branch/PR cancels the older in-flight run, so
# rapid pushes don't pile up redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned via .nvmrc (20.19.0) so CI matches local + the engines
          # range in package.json (>=20.19 <23). 20.19 is the floor that
          # enables require(ESM) by default — older 20.x (e.g. 20.11)
          # throws ERR_REQUIRE_ESM when the jsdom test stack loads its
          # now-ESM-only transitive deps (@exodus/bytes).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
