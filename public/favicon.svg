<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "for" wordmark, serif, brand indigo (#2D3B8E to roughly match the
       deep indigo used across the app). Inline SVG so the favicon stays
       crisp at every DPI without depending on an external font file. -->
  <text x="6" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#2D3B8E">for</text>
  <rect x="6" y="30" width="28" height="3.5" rx="1.75" fill="#2D3B8E"/>
  <text x="6" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#2D3B8E">men</text>
</svg>
